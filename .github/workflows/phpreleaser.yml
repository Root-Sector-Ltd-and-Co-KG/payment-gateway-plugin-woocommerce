name: Validate and Release WooCommerce Plugin

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed plugin source commit to tag"
        required: true
        type: string
      version:
        description: "Exact x.y.z plugin version to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: woo-plugin-release-${{ github.event_name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  PLUGIN_RELEASE_VERSION: ${{ inputs.version || '' }}
  RELEASE_POLICY_REVISION: ${{ github.sha }}
  RELEASE_POLICY_MANIFEST: release-control/.github/release-policy.json
  RELEASE_WORKFLOW_PATH: .github/workflows/phpreleaser.yml
  RELEASE_POLICY_PATH: scripts/validate-release-policy.mjs

jobs:
  validate:
    name: Validate exact source, trusted policy, and HPOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require protected default-branch release controls
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$DEFAULT_BRANCH" != "main" || "$WORKFLOW_REF" != "refs/heads/main" || "$WORKFLOW_REF_PROTECTED" != "true" ]]; then
            echo "::error::Release publication must run from refs/heads/main, the protected default branch."
            exit 1
          fi

      - name: Checkout release controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Checkout selected plugin source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: payment-gateway-plugin-woocommerce
          persist-credentials: false

      - name: Verify selected source identity
        working-directory: payment-gateway-plugin-woocommerce
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase commit SHA."
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Selected source resolved to $CHECKED_OUT_SHA instead of $SOURCE_SHA."
            exit 1
          fi

      - name: Validate selected plugin PHP regressions
        working-directory: payment-gateway-plugin-woocommerce
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/api-error-context.test.php
          php tests/customer-risk-integration.test.php
          php tests/customer-risk-error-context.test.php
          php tests/ipn-v2-receiver.test.php

      - name: Validate release-control regressions
        run: |
          php release-control/tests/release-workflow.test.php
          node --test release-control/tests/release-policy.test.mjs release-control/tests/release-workflow.test.mjs release-control/tests/publish-release.test.mjs

      - name: Validate trusted release manifest, policy, and source
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          node release-control/scripts/validate-release-policy.mjs --repository payment-gateway-plugin-woocommerce --source-sha "$SOURCE_SHA" --version "$PLUGIN_RELEASE_VERSION" --release-manifest "$RELEASE_POLICY_MANIFEST" --workflow-ref "$WORKFLOW_REF" --default-branch "$DEFAULT_BRANCH" --workflow-path "$RELEASE_WORKFLOW_PATH" --policy-path "$RELEASE_POLICY_PATH" --policy-revision "$RELEASE_POLICY_REVISION" --output plugin-release-validation.json

      - name: Set up Node.js for HPOS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: payment-gateway-plugin-woocommerce/package-lock.json

      - name: Install the locked WordPress environment
        working-directory: payment-gateway-plugin-woocommerce
        run: npm ci

      - name: Start WordPress and WooCommerce
        working-directory: payment-gateway-plugin-woocommerce
        run: npm run wp-env -- start

      - name: Enable authoritative HPOS storage
        working-directory: payment-gateway-plugin-woocommerce
        run: |
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_enabled yes
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Verify durable IPN v2 behavior through WooCommerce HPOS
        working-directory: payment-gateway-plugin-woocommerce
        run: npm run wp-env -- run cli wp eval-file wp-content/plugins/payment-gateway-plugin-woocommerce/tests/hpos-integration.php

      - name: Stop WordPress
        if: always()
        working-directory: payment-gateway-plugin-woocommerce
        run: npm run wp-env -- stop


      - name: Build exact versioned archive, checksum, and validation evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="$(jq -er --arg version "$PLUGIN_RELEASE_VERSION" '.releases[$version].artifactName' "$RELEASE_POLICY_MANIFEST")"
          ARCHIVE_ROOT="$(jq -er --arg version "$PLUGIN_RELEASE_VERSION" '.releases[$version].archiveRoot' "$RELEASE_POLICY_MANIFEST")"
          PREPARE_SCRIPT="$(jq -er --arg version "$PLUGIN_RELEASE_VERSION" '.releases[$version].prepareScript' "$RELEASE_POLICY_MANIFEST")"
          RELEASE_NOTES_FILE="$(jq -er --arg version "$PLUGIN_RELEASE_VERSION" '.releases[$version].releaseNotesFile' "$RELEASE_POLICY_MANIFEST")"
          PACKAGE_DIR="dist/$ARCHIVE_ROOT"

          mkdir -p "$PACKAGE_DIR" release-bundle
          git -C payment-gateway-plugin-woocommerce archive "$SOURCE_SHA" | tar -x -C "$PACKAGE_DIR"
          (cd "$PACKAGE_DIR" && php "$GITHUB_WORKSPACE/release-control/$PREPARE_SCRIPT" "$PLUGIN_RELEASE_VERSION")
          cp "$PACKAGE_DIR/$RELEASE_NOTES_FILE" release-bundle/release-notes.md
          rm -rf "$PACKAGE_DIR/.github" "$PACKAGE_DIR/scripts" "$PACKAGE_DIR/tests" "$PACKAGE_DIR/$RELEASE_NOTES_FILE"
          (
            cd dist
            zip -qr "../release-bundle/$ARTIFACT_NAME" "$ARCHIVE_ROOT"
          )
          sha256sum "release-bundle/$ARTIFACT_NAME" | sed "s#release-bundle/##" > "release-bundle/$ARTIFACT_NAME.sha256"

          ARTIFACT_SHA256="$(cut -d ' ' -f1 "release-bundle/$ARTIFACT_NAME.sha256")"
          jq --arg artifactName "$ARTIFACT_NAME" --arg artifactSha256 "$ARTIFACT_SHA256" --arg checksumAssetName "$ARTIFACT_NAME.sha256" --arg validationJobResult "success" --arg workflowRunUrl "https://github.com/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" '. + {
              artifactName: $artifactName,
              artifactSha256: $artifactSha256,
              checksumAssetName: $checksumAssetName,
              validationJobResult: $validationJobResult,
              workflowRunUrl: $workflowRunUrl
            }' plugin-release-validation.json > release-bundle/plugin-release-validation.json

      - name: Transfer validated release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ github.run_id }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified immutable plugin release
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout protected release controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundle-${{ github.run_id }}
          path: release-bundle

      - name: Create or resume verified draft, read back assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_JOB_RESULT: ${{ needs.validate.result }}
        run: |
          ARTIFACT_NAME="$(jq -er --arg version "$PLUGIN_RELEASE_VERSION" '.releases[$version].artifactName' "$RELEASE_POLICY_MANIFEST")"
          node release-control/scripts/publish-release.mjs --repository "$REPOSITORY" --source-sha "$SOURCE_SHA" --version "$PLUGIN_RELEASE_VERSION" --policy-revision "$RELEASE_POLICY_REVISION" --release-manifest "$RELEASE_POLICY_MANIFEST" --artifact "release-bundle/$ARTIFACT_NAME" --checksum "release-bundle/$ARTIFACT_NAME.sha256" --validation "release-bundle/plugin-release-validation.json" --notes "release-bundle/release-notes.md" --title "WooCommerce Payment Gateway App $PLUGIN_RELEASE_VERSION" --validation-job-result "$VALIDATION_JOB_RESULT"
