name: Validate WooCommerce Release Controls

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate receiver and release controls
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/api-error-context.test.php
          php tests/customer-risk-integration.test.php
          php tests/customer-risk-error-context.test.php
          php tests/ipn-v2-receiver.test.php
          php tests/release-workflow.test.php
          node --test tests/release-policy.test.mjs tests/release-workflow.test.mjs tests/publish-release.test.mjs

      - name: Set up Node.js for HPOS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the locked WordPress environment
        run: npm ci

      - name: Start WordPress and WooCommerce
        run: npm run wp-env -- start

      - name: Enable authoritative HPOS storage
        run: |
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_enabled yes
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Verify durable IPN v2 behavior through WooCommerce HPOS
        run: npm run wp-env -- run cli wp eval-file wp-content/plugins/payment-gateway-plugin-woocommerce/tests/hpos-integration.php

      - name: Stop WordPress
        if: always()
        run: npm run wp-env -- stop
