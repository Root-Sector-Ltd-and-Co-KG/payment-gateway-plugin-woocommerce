name: WooCommerce HPOS integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  hpos-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install the locked WordPress environment
        run: npm ci

      - name: Start WordPress and WooCommerce
        run: npm run wp-env -- start

      - name: Enable authoritative HPOS storage
        run: |
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_enabled yes
          npm run wp-env -- run cli wp option update woocommerce_custom_orders_table_data_sync_enabled no

      - name: Verify durable IPN v2 behavior through WooCommerce HPOS
        run: npm run wp-env -- run cli wp eval-file wp-content/plugins/payment-gateway-plugin-woocommerce/tests/hpos-integration.php

      - name: Stop WordPress
        if: always()
        run: npm run wp-env -- stop
